name: Soroban contract

on:
  pull_request:
    paths: ['contract/**', '.github/workflows/soroban-contract.yml']
  push:
    branches: [main]
    paths: ['contract/**', '.github/workflows/soroban-contract.yml']

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Format
        run: cargo fmt --manifest-path contract/Cargo.toml --all -- --check
      - name: Unit tests
        run: cargo test --manifest-path contract/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path contract/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build Wasm
        run: cargo build --manifest-path contract/Cargo.toml --package save-savings-vault --target wasm32v1-none --release --locked

