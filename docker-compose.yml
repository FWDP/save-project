version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: save-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: save
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: save-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  silo:
    image: pgsty/silo:latest
    container_name: save-silo
    restart: unless-stopped
    command: server /data --console-address ':9001'
    ports:
      - '9002:9000'
      - '9003:9001'
    environment:
      MINIO_ROOT_USER: save-access-key
      MINIO_ROOT_PASSWORD: save-secret-key
      SILO_ROOT_USER: save-access-key
      SILO_ROOT_PASSWORD: save-secret-key
    volumes:
      - silo_data:/data

volumes:
  mongo_data:
  silo_data:
