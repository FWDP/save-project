version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: save-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: save
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: save-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    container_name: save-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: save-access-key
      MINIO_ROOT_PASSWORD: save-secret-key
    volumes:
      - minio_data:/data

volumes:
  mongo_data:
  minio_data:
