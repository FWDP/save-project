# Local Nginx virtual host for the SAVE Finance Web application.
# Next.js dev server: npm run web:dev  (port 3002)
# Next.js production: npm run web:start (port 3002)
# NestJS API:         npm --prefix backend run start (port 3000)

server {
    listen 80;
    listen [::]:80;
    server_name save.local;

    server_tokens off;

    # ── Upload size for AI receipt scanning (10 MB image/PDF) ───────────
    client_max_body_size 12m;

    # ── Proxy timeouts ───────────────────────────────────────────────────
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;

    # ── Common proxy headers ─────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── NestJS API  (/api/* → http://127.0.0.1:3000) ────────────────────
    # Strips the /api prefix so the backend sees its native routes.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;

        # Longer timeout for Gemini AI receipt scans (up to 30 s)
        proxy_read_timeout 45s;
    }

    # ── Next.js HMR WebSocket (dev only) ────────────────────────────────
    location /_next/webpack-hmr {
        proxy_pass http://127.0.0.1:3002/_next/webpack-hmr;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Next.js static assets — long-lived cache ────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002/_next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ── Next.js — all other routes ───────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3002;

        # Supabase sessions use multiple Set-Cookie headers after OAuth.
        # The response header buffer is required even with buffering off.
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;

        # Required for Next.js streaming / React Server Components
        proxy_buffering off;
        proxy_cache     off;
    }

    # ── Block dotfiles ───────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/save.local.access.log;
    error_log  /var/log/nginx/save.local.error.log warn;
}
